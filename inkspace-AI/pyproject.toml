[project]
name = "inkscape-ai"
version = "0.1.0"
description = "Inkscape MCP (Blender-style): live connection, canvas capture, edit tools"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.3.0",
    "inkex>=1.4",
    "Pillow>=10.0",
    "filelock>=3.0",
]

[project.optional-dependencies]
dbus = ["PyGObject>=3.42"]

[project.scripts]
inkscape-ai = "inkscape_ai.server:main"
inkscape-ai-bridge = "inkscape_ai.bridge:main"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
