[project]
name = "inkscape-ai-beta-backend"
version = "0.2.0"
description = "Minimal anonymous-session FastAPI backend for Inkscape AI beta"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "apscheduler>=3.10.4",
    # SVG->PNG for the multimodal LLM review. On the Amazon Linux prod host this needs the
    # cairo system lib: `sudo yum install -y cairo`. Local dev falls back to the Inkscape CLI.
    "cairosvg>=2.7.0",
    "llama-cloud>=1.0",
    "fastapi>=0.121.0",
    "langchain-anthropic>=0.3.0",
    "langchain-aws>=0.2.0",
    "langchain-core>=1.0.4",
    "langchain-google-genai>=2.0.0",
    "langchain-openai>=1.0.2",
    "lxml>=5.3.0",
    "pydantic>=2.11.1",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.1.0",
    "python-multipart>=0.0.20",
    "sqlmodel>=0.0.24",
    "structlog>=25.2.0",
    "svgelements>=1.9.6",
    "tenacity>=9.1.2",
    "uvicorn>=0.34.0",
]

[project.optional-dependencies]
dev = ["httpx>=0.28.1", "pytest>=8.3.5", "ruff>=0.9.0"]

[tool.pytest.ini_options]
python_files = ["test_*.py", "*_test.py"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
exclude = [".venv", "data"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
