<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" version="1.1">
  <defs>
    <style>
      .wing-outline { fill: #7b4b9e; stroke: #6b3d8e; stroke-width: 4; }
      .wing-inner { fill: #f8b4c4; stroke: none; }
      .wing-detail { fill: none; stroke: #9b6bb0; stroke-width: 2; }
      .body-orange { fill: #ff8c42; stroke: #8b4513; stroke-width: 3; }
      .body-stripe { fill: none; stroke: #8b4513; stroke-width: 2.5; }
      .head { fill: #ff8c42; stroke: #8b4513; stroke-width: 3; }
      .eye { fill: #1a1a1a; stroke: none; }
      .eye-highlight { fill: #fff; }
      .mouth { fill: none; stroke: #8b4513; stroke-width: 2; stroke-linecap: round; }
      .antenna { fill: none; stroke: #5d3a1a; stroke-width: 2; stroke-linecap: round; }
    </style>
  </defs>
  <g transform="translate(200,200)">
    <!-- wings (behind body) -->
    <g id="wings">
      <!-- upper left -->
      <path class="wing-outline" d="M 0,-20 C -75,-80 -95,-35 -70,25 C -55,55 -25,50 0,25 Z" />
      <path class="wing-inner" d="M -15,-18 C -55,-55 -65,-25 -45,15 C -35,35 -18,32 0,18 Z" />
      <path class="wing-detail" d="M -48,-15 Q -35,-35 -25,-12 Q -18,5 -30,15 Q -42,22 -48,0" />
      <!-- upper right -->
      <path class="wing-outline" d="M 0,-20 C 75,-80 95,-35 70,25 C 55,55 25,50 0,25 Z" />
      <path class="wing-inner" d="M 15,-18 C 55,-55 65,-25 45,15 C 35,35 18,32 0,18 Z" />
      <path class="wing-detail" d="M 48,-15 Q 35,-35 25,-12 Q 18,5 30,15 Q 42,22 48,0" />
      <!-- lower left -->
      <path class="wing-outline" d="M 0,15 C -55,45 -60,85 -35,115 C -18,135 5,120 0,85 Z" />
      <path class="wing-inner" d="M -8,25 C -38,48 -42,78 -25,98 C -12,112 2,102 0,78 Z" />
      <path class="wing-detail" d="M -28,65 Q -18,50 -10,70" />
      <!-- lower right -->
      <path class="wing-outline" d="M 0,15 C 55,45 60,85 35,115 C 18,135 -5,120 0,85 Z" />
      <path class="wing-inner" d="M 8,25 C 38,48 42,78 25,98 C 12,112 -2,102 0,78 Z" />
      <path class="wing-detail" d="M 28,65 Q 18,50 10,70" />
    </g>
    <!-- body -->
    <path class="body-orange" d="M -12, -25 L 12, -25 L 14, 95 L -14, 95 Z" />
    <path class="body-stripe" d="M -12, -5 L 12, -5 M -12, 15 L 12, 15 M -12, 35 L 12, 35" />
    <!-- head -->
    <circle class="head" cx="0" cy="-45" r="28" />
    <!-- eyes -->
    <circle class="eye" cx="-10" cy="-48" r="8" />
    <circle class="eye" cx="10" cy="-48" r="8" />
    <circle class="eye-highlight" cx="-12" cy="-50" r="2.5" />
    <circle class="eye-highlight" cx="8" cy="-50" r="2.5" />
    <!-- smile -->
    <path class="mouth" d="M -12, -38 Q 0, -32 12, -38" />
    <!-- antennae with spiral tips -->
    <path class="antenna" d="M -18, -68 L -32, -92" />
    <path class="antenna" d="M 18, -68 L 32, -92" />
    <path class="antenna" d="M -32,-92 c 2,0 3,1.5 2,3.5 c -1,2 -3,1.5 -3.5,-0.5 c -0.5,-2 1,-3.5 2.5,-3" fill="none" />
    <path class="antenna" d="M 32,-92 c -2,0 -3,1.5 -2,3.5 c 1,2 3,1.5 3.5,-0.5 c 0.5,-2 -1,-3.5 -2.5,-3" fill="none" />
  </g>
</svg>
